<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .sine-curve {
            stroke-dasharray: 1000;
            stroke-dashoffset: 0;
        }
        /* Custom scrollbar suppression for a clean iOS look */
        ::-webkit-scrollbar { display: none; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-bright": "#faf9fe",
                        "inverse-surface": "#2f3034",
                        "primary-fixed": "#a5f4b8",
                        "on-tertiary-container": "#ffcbc6",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#9ae9ae",
                        "on-secondary-fixed-variant": "#314d38",
                        "background": "#faf9fe",
                        "on-surface-variant": "#404940",
                        "tertiary-fixed": "#ffdad6",
                        "primary": "#005129",
                        "on-tertiary-fixed": "#410002",
                        "secondary-fixed-dim": "#aeceb3",
                        "surface-dim": "#dad9df",
                        "outline": "#707a70",
                        "on-secondary-container": "#4e6b54",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb4ac",
                        "on-surface": "#1a1b1f",
                        "on-background": "#1a1b1f",
                        "secondary-container": "#caebce",
                        "primary-fixed-dim": "#89d89e",
                        "surface-container-highest": "#e3e2e7",
                        "surface": "#faf9fe",
                        "on-primary-fixed-variant": "#005229",
                        "outline-variant": "#bfc9be",
                        "surface-container": "#eeedf3",
                        "surface-container-low": "#f4f3f8",
                        "on-tertiary-fixed-variant": "#93000d",
                        "secondary": "#48654e",
                        "on-primary-fixed": "#00210d",
                        "inverse-on-surface": "#f1f0f5",
                        "surface-container-high": "#e9e7ed",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#05210f",
                        "inverse-primary": "#89d89e",
                        "secondary-fixed": "#caebce",
                        "primary-container": "#1a6b3c",
                        "surface-tint": "#1b6c3d",
                        "tertiary-container": "#ba161b",
                        "surface-variant": "#e3e2e7",
                        "tertiary": "#92000d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-[#faf9fe] dark:bg-slate-950 flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#005129] dark:text-emerald-500 cursor-pointer active:scale-95 transition-transform">arrow_back</span>
<div class="flex flex-col">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">角度训练</span>
<h1 class="font-['Inter'] font-semibold tracking-tight text-lg text-[#005129] dark:text-emerald-500">进球点对照表</h1>
</div>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-slate-500">more_horiz</span>
</div>
</header>
<div class="bg-[#f4f3f8] dark:bg-slate-900 h-[4px] w-full"></div>
<!-- Main Content Area -->
<main class="max-w-md mx-auto px-4 pt-4">
<!-- Segmented Tab / NavigationDrawer Semantic Interface -->
<div class="flex p-1 bg-surface-container-low rounded-xl mb-6 shadow-sm">
<!-- 8-Ball Active -->
<button class="flex-1 py-2 px-4 bg-secondary-container text-primary font-bold rounded-lg text-sm transition-all">
                8-Ball (中八)
            </button>
<button class="flex-1 py-2 px-4 text-slate-600 dark:text-slate-400 font-medium text-sm hover:bg-surface-container-high transition-all rounded-lg">
                9-Ball
            </button>
<button class="flex-1 py-2 px-4 text-slate-600 dark:text-slate-400 font-medium text-sm hover:bg-surface-container-high transition-all rounded-lg">
                Snooker
            </button>
</div>
<!-- Scroll Context: Top edge of preceding card -->
<div class="bg-surface-container-lowest rounded-xl p-4 mb-4 opacity-50 translate-y-[-10px] scale-95 border-b border-outline-variant/15">
<p class="text-xs text-on-surface-variant font-medium">
                切入角越大，接触点越偏离球心，薄球越难控制。
            </p>
</div>
<!-- Sine Curve Chart Card (The Primary Task) -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(26,27,31,0.04)] overflow-hidden border border-outline-variant/10">
<div class="p-6">
<!-- Card Header -->
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">insights</span>
</div>
<h2 class="text-lg font-bold tracking-tight text-on-surface">d/R 与角度关系</h2>
</div>
<!-- SVG Chart Area -->
<div class="relative w-full aspect-[4/3] mb-6">
<svg class="w-full h-full overflow-visible" viewbox="0 0 400 300">
<!-- Grid Lines -->
<g class="opacity-[0.1]">
<line stroke="currentColor" x1="40" x2="380" y1="20" y2="20"></line>
<line stroke="currentColor" x1="40" x2="380" y1="85" y2="85"></line>
<line stroke="currentColor" x1="40" x2="380" y1="150" y2="150"></line>
<line stroke="currentColor" x1="40" x2="380" y1="215" y2="215"></line>
<line stroke="currentColor" x1="40" x2="380" y1="280" y2="280"></line>
</g>
<!-- Axis Labels Y -->
<g class="text-[10px] font-medium fill-slate-400">
<text text-anchor="end" x="32" y="25">2.0</text>
<text text-anchor="end" x="32" y="155">1.0</text>
<text text-anchor="end" x="32" y="285">0.0</text>
</g>
<!-- Axis Labels X -->
<g class="text-[10px] font-medium fill-slate-400">
<text text-anchor="middle" x="40" y="298">0°</text>
<text text-anchor="middle" x="153.3" y="298">30°</text>
<text text-anchor="middle" x="266.6" y="298">60°</text>
<text text-anchor="middle" x="380" y="298">90°</text>
</g>
<!-- Axis Titles -->
<text class="text-[9px] font-bold fill-primary uppercase tracking-widest" text-anchor="middle" transform="rotate(-90 15,150)" x="15" y="150">d / R</text>
<text class="text-[9px] font-bold fill-primary uppercase tracking-widest" text-anchor="middle" x="210" y="315">切入角 (°)</text>
<!-- Curve Fill (Gradient) -->
<defs>
<lineargradient id="curveGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#1a6b3c" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="#1a6b3c" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M 40 280 Q 210 280 380 20 L 380 280 L 40 280 Z" fill="url(#curveGradient)"></path>
<!-- Sine Curve d/R = 2 * sin(theta) -->
<!-- 0deg is (40, 280), 90deg is (380, 20) -->
<!-- X: 40 + (theta/90)*340 -->
<!-- Y: 280 - (sin(theta)*2 / 2.0)*260 -->
<path class="sine-curve" d="M 40,280 
                                 C 100,280 180,250 250,180
                                 S 350,60 380,20" fill="none" stroke="#1a6b3c" stroke-width="2.5"></path>
<!-- Markers (Red Dots) -->
<!-- 0°: 0.00 -->
<circle cx="40" cy="280" fill="#E53935" r="4" stroke="white" stroke-width="1.5"></circle>
<text class="text-[9px] font-bold fill-slate-600" x="48" y="275">0.00 (全球)</text>
<!-- 10°: 0.35 -->
<circle cx="77.7" cy="234.5" fill="#E53935" r="4" stroke="white" stroke-width="1.5"></circle>
<text class="text-[9px] font-bold fill-slate-600" x="86" y="235">0.35 (≈1/3球)</text>
<!-- 30°: 1.00 (Most Prominent) -->
<circle cx="153.3" cy="150" fill="#E53935" r="6" stroke="white" stroke-width="2"></circle>
<text class="text-[11px] font-black fill-primary" x="165" y="145">1.00 (半球)</text>
<line stroke="#E53935" stroke-dasharray="2,2" stroke-width="1" x1="153.3" x2="153.3" y1="150" y2="280"></line>
<line stroke="#E53935" stroke-dasharray="2,2" stroke-width="1" x1="40" x2="153.3" y1="150" y2="150"></line>
<!-- 48.6°: 1.50 -->
<circle cx="223.6" cy="85" fill="#E53935" r="4" stroke="white" stroke-width="1.5"></circle>
<text class="text-[9px] font-bold fill-slate-600" x="233" y="80">1.50 (3/4点)</text>
<!-- 90°: 2.00 -->
<circle cx="380" cy="20" fill="#E53935" r="4" stroke="white" stroke-width="1.5"></circle>
<text class="text-[9px] font-bold fill-slate-600" text-anchor="end" x="375" y="45">2.00 (极薄球)</text>
</svg>
</div>
<!-- Footer Note -->
<div class="mt-8 pt-4 border-t border-outline-variant/10">
<p class="text-[11px] text-on-surface-variant leading-relaxed text-center italic">
                        曲线展示切入角与 d/R 的正弦关系，红点标注常用通称角度
                    </p>
</div>
</div>
</section>
<!-- Technical Metadata Bento Section -->
<div class="mt-6 grid grid-cols-2 gap-4">
<div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-1">
<span class="text-[10px] font-black tracking-widest text-primary/60 uppercase">Equation</span>
<span class="text-sm font-mono font-bold text-primary">d = 2R sin(θ)</span>
</div>
<div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-1">
<span class="text-[10px] font-black tracking-widest text-primary/60 uppercase">Precision</span>
<span class="text-sm font-mono font-bold text-primary">Δ±0.01 mm</span>
</div>
</div>
<div class="h-12"></div> <!-- 48pt Bottom Spacer -->
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 border-t border-[#bfc9be]/15 bg-[#faf9fe]/70 backdrop-blur-xl flex justify-around items-center px-4 pb-6 pt-2">
<div class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-[#005129] transition-transform active:scale-90">
<span class="material-symbols-outlined mb-1">sports_score</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest">Training</span>
</div>
<div class="flex flex-col items-center justify-center bg-gradient-to-b from-[#005129] to-[#1a6b3c] text-white rounded-full p-3 shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">insights</span>
<!-- No label for active FAB-like state per system design -->
</div>
<div class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-[#005129] transition-transform active:scale-90">
<span class="material-symbols-outlined mb-1">model_training</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest">Drills</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-[#005129] transition-transform active:scale-90">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest">Profile</span>
</div>
</nav>
</body></html>

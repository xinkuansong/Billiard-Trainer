<!DOCTYPE html>

<html lang="zh-Hans"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c1f",
                        "secondary-container": "#e0dfe4",
                        "primary-fixed-dim": "#89d89e",
                        "tertiary-fixed-dim": "#ffb4ac",
                        "on-surface": "#1a1c1f",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#626267",
                        "on-tertiary-fixed": "#410002",
                        "outline": "#707a70",
                        "surface-dim": "#d9dade",
                        "secondary-fixed-dim": "#c6c6cb",
                        "primary": "#005129",
                        "tertiary-fixed": "#ffdad6",
                        "on-surface-variant": "#404940",
                        "background": "#f9f9fe",
                        "on-secondary-fixed-variant": "#46464b",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#9ae9ae",
                        "primary-fixed": "#a5f4b8",
                        "inverse-surface": "#2e3034",
                        "surface-bright": "#f9f9fe",
                        "on-tertiary-container": "#ffcbc6",
                        "on-error": "#ffffff",
                        "tertiary": "#92000d",
                        "tertiary-container": "#ba161b",
                        "surface-variant": "#e2e2e7",
                        "primary-container": "#1a6b3c",
                        "surface-tint": "#1b6c3d",
                        "inverse-primary": "#89d89e",
                        "secondary-fixed": "#e3e2e7",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#1a1b1f",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e8e8ed",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f0f0f5",
                        "secondary": "#5d5e63",
                        "on-primary-fixed": "#00210d",
                        "outline-variant": "#bfc9be",
                        "surface-container": "#ededf2",
                        "surface-container-low": "#f3f3f8",
                        "on-tertiary-fixed-variant": "#93000d",
                        "on-primary-fixed-variant": "#005229",
                        "surface-container-highest": "#e2e2e7",
                        "surface": "#f9f9fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .canvas-bg-felt {
            background-image: radial-gradient(circle at 50% 50%, #1d7a44 0%, #166030 100%);
        }
        .angle-arc {
            border: 2px solid rgba(255,255,255,0.4);
            border-bottom: 0;
            border-left: 0;
            border-radius: 0 100% 0 0;
            transform: rotate(-48deg) skewX(6deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-[#ffffff]/80 dark:bg-[#1a1c1f]/80 backdrop-blur-xl">
<div class="flex items-center justify-between px-4 h-16 w-full relative">
<div class="flex items-center gap-1 cursor-pointer active:scale-95 duration-200 text-[#005129] dark:text-[#4ade80]">
<span class="material-symbols-outlined" style="font-size: 24px;">chevron_left</span>
<span class="text-[17px] font-medium">角度训练</span>
</div>
<h1 class="absolute left-1/2 -translate-x-1/2 font-['Inter'] text-[17px] font-bold tracking-tight text-[#1a1c1f] dark:text-[#ffffff]">
                角度预测
            </h1>
<div class="w-20"></div> <!-- Spacer for balance -->
<div class="bg-[#ededf2] dark:bg-[#2d2e32] h-[1px] w-full absolute bottom-0"></div>
</div>
</header>
<main class="pt-20 pb-12 px-4 max-w-md mx-auto space-y-4">
<!-- Angle Display Canvas Card -->
<section class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm">
<div class="relative w-full h-[280px] bg-surface-tint canvas-bg-felt overflow-hidden">
<!-- Grid/Axes -->
<div class="absolute bottom-[20px] left-[20px] w-full h-full pointer-events-none">
<!-- Y Axis -->
<div class="absolute bottom-0 left-0 w-[2px] h-[220px] bg-white"></div>
<!-- X Axis -->
<div class="absolute bottom-0 left-0 h-[2px] w-[300px] bg-white"></div>
<!-- Labels -->
<span class="absolute -top-6 -left-1 text-white text-[11px] font-medium opacity-80">90°</span>
<span class="absolute -bottom-6 left-[285px] text-white text-[11px] font-medium opacity-80">0°</span>
<!-- Origin Dot -->
<div class="absolute -bottom-[4px] -left-[4px] w-2 h-2 rounded-full bg-white shadow-sm z-10"></div>
<!-- Angle Line -->
<div class="absolute bottom-0 left-0 h-[200px] w-[3px] bg-white origin-bottom-left" style="transform: rotate(48deg);"></div>
<!-- Angle Arc Visualization -->
<div class="absolute bottom-0 left-0 w-[40px] h-[40px] border-t-2 border-r-2 border-white/40 rounded-tr-full origin-bottom-left" style="transform: rotate(-42deg);"></div>
</div>
<!-- Decorative Texture Overlay -->
<div class="absolute inset-0 opacity-10 mix-blend-overlay pointer-events-none" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD1tfZeFL4onPdZZV-CK2OPeASnPNKsUxIfG1blrhd5XpUXxN3SVTtsR634si_Nm9P0x9Q2e-FInCg89ALIzCF9FFML2A3N7uvyyF4vMSgVzOVnbhke9D20sbHWhDtL883NHANdMYdhnFR61bOlF6H5GB_hX26b_W6kEN4td0yFpVmQ0_5OX1cauLAsHomC1xLrVXzlcsWeIdBRomawRHtG2dst93kq1SLT6WCk3sx-3K4OR9Vhf-wjRVtg2Fmri-25jq2v8BWoZm8z');"></div>
</div>
</section>
<!-- Control Buttons Row -->
<section class="flex items-center gap-3">
<button class="flex-1 h-[44px] bg-primary-container text-on-primary font-semibold text-[15px] rounded-lg active:scale-[0.98] transition-transform">
                生成随机角度
            </button>
<button class="px-4 h-[44px] bg-secondary-container/50 text-on-surface font-normal text-[14px] rounded-lg active:scale-[0.98] transition-transform">
                显示参考
            </button>
<button class="px-2 text-error font-normal text-[14px] active:opacity-60 transition-opacity">
                重置统计
            </button>
</section>
<!-- Input Area -->
<section class="flex flex-col items-center py-6 space-y-4">
<h2 class="text-[17px] font-semibold text-on-surface">请估算角度</h2>
<div class="relative">
<div class="w-[200px] h-[56px] bg-surface-container-lowest border-2 border-primary rounded-xl flex items-center justify-center shadow-sm">
<span class="text-[32px] font-bold text-on-surface">42°</span>
</div>
<p class="mt-2 text-center text-[13px] text-on-surface-variant">范围: 0° - 90°</p>
</div>
<button class="w-full h-[50px] bg-primary-container text-on-primary font-semibold text-[17px] rounded-xl active:scale-[0.98] transition-all shadow-md">
                确认
            </button>
</section>
<!-- Statistics Panel (Bento Grid Style) -->
<section class="bg-surface-container-lowest p-5 rounded-xl shadow-sm border border-outline/5">
<div class="grid grid-cols-2 gap-y-6 gap-x-4">
<!-- Practice Count -->
<div class="flex flex-col">
<span class="text-[22px] font-bold text-on-surface leading-none">15</span>
<span class="text-[13px] text-on-surface-variant mt-1">练习次数</span>
</div>
<!-- Correct Count -->
<div class="flex flex-col">
<div class="flex items-baseline gap-1">
<span class="text-[22px] font-bold text-on-surface leading-none">9</span>
<span class="text-[11px] text-on-surface-variant">(误差≤3°)</span>
</div>
<span class="text-[13px] text-on-surface-variant mt-1">正确次数</span>
</div>
<!-- Accuracy -->
<div class="flex flex-col">
<span class="text-[22px] font-bold text-primary leading-none">60%</span>
<span class="text-[13px] text-on-surface-variant mt-1">正确率</span>
</div>
<!-- Avg Error -->
<div class="flex flex-col">
<span class="text-[22px] font-bold text-on-surface leading-none">4.2°</span>
<span class="text-[13px] text-on-surface-variant mt-1">平均误差</span>
</div>
</div>
</section>
<!-- Footer Spacer -->
<div class="h-6"></div>
</main>
</body></html>
